plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'kotlin-kapt'
}


android {
//    signingConfigs {
//        config {
//            keyAlias 'key0'
//            keyPassword 'visithealth'
//            storeFile file('C:\\Users\\chinm\\AndroidStudioProjects\\GoogleFitSdk\\release.jks')
//            storePassword 'visithealth'
//        }
//    }

    defaultConfig {
        applicationId "com.example.googlefitsdk"
        minSdk 23
        compileSdk 34
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


    }

    buildTypes {
        release {
//            signingConfig signingConfigs.config
//            debuggable true
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        dataBinding true
    }

    namespace 'com.example.app'
}

dependencies {
    implementation project(':visit')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    def retrofit_version = "2.11.0"
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")

    implementation 'com.github.delight-im:Android-AdvancedWebView:v3.0.0'


    //Chucker
    debugApi "com.github.chuckerteam.chucker:library:4.0.0"
    releaseApi "com.github.chuckerteam.chucker:library-no-op:4.0.0"


    implementation "androidx.browser:browser:1.8.0"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"


    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    implementation "com.jakewharton.timber:timber:5.0.1"

}